# Modèles candidats pour l'extraction (LLM_EXTRACTION §5). Aucun chiffre de performance ici : ils viennent du pilote.
# Tarifs Anthropic : API première partie, cache de la référence du 24 juin 2026 (à re-vérifier au moment du run).
