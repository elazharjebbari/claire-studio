  runs_per_model: 3                  # température 0, seed fixé si supporté
  reference: "two lawyers, independently validated templates"
  weighted_score: {field_accuracy: 0.40, hallucination_rate: 0.20, reproducibility: 0.15, cost: 0.15, local_deployability: 0.10}
  replication: "best open model re-runs the holdout extraction"
