# Enregistrement d'expérience — modèle (REPRODUCIBILITY.md §1). Un fichier par run, copié dans results/<kind>/<run_id>/config.yaml
run:
  id: "auto"                      # UUID généré
  kind: detection_rules           # extraction | graph_build | detection_rules | classification | embedding | evaluation | audit
  description: "E2 — frozen grey-list rules on validated templates, holdout"
code:
  repo: "claire-studio"
  commit: "auto"                  # SHA git ; refuse de tourner si l'arbre est sale sauf --allow-dirty (consigné)
dataset:
  fingerprint: "7116e627f528c5572457e79d9e53d2e71bfc21e3a20aacb43e9d3072cfb70e2e"
  export_dir: "data/processed"
  taxonomy: T11
  taxonomy_spec_version: "v1"
split:
  scheme: design_holdout          # design_holdout | group_kfold_document
  population: holdout             # designSet | holdout | all
  k: 5
  seed: 42
rules:
  file: "graph/rules/grey_list_queries.yaml"
  version: "0.1-draft"
  rules_hash: "auto"              # SHA-256 du fichier
  frozen_at: null                 # doit être renseigné et antérieur à started_at pour population=holdout
templates:
  source: validated               # validated | proposed
  extraction_run_id: null
model:                            # pour extraction / classification / embedding
  provider: null
  name: null
  version: null
  prompt_id: null
  prompt_hash: null
  schema_hash: null
  temperature: 0.0
  seed: 42
  effort: null
params:
  projection: evidence_only       # evidence_only | whole_clause
  bootstrap_resamples: 1000
  ci_level: 0.95
gates:
  require_frozen_rules: true
  require_rule_isolation: true    # lint : pas de LABELED / Category dans les règles
  require_clean_tree: true
  require_population_constant: true
outputs:
  dir: "results/detection/{run_id}"
  predictions: "predictions.jsonl"
  metrics: "metrics.json"
  tables: ["by_rule.csv", "by_item.csv", "by_category.csv"]
cost:
  tokens_in: null
  tokens_out: null
  usd_estimate: null
  gpu_hours: null
