# Schéma du Legal KG (modèle D, couches L1–L5 + provenance) — v0.1, 14 septembre 2026
# Source unique : les contraintes Memgraph (graph/schema/memgraph_schema.cypher), le JSON Schema
# d'extraction (llm/schemas/clause_template.schema.json) et l'export RDF (vue B) en dérivent.
version: 0.2
naming:
  node_labels: PascalCase
  relationship_types: UPPER_SNAKE
  properties: snake_case
  ids: "<label-lowercase>:<document>:<local>"   # ex. sentence:9gag:12 · clause:9gag:c003 · norm:9gag:c003:n1

vocabularies:
  actor: [provider, user, third_party]
  modality: [obligation, permission, prohibition, power]
  condition: [for_cause, specified_reason, discretion, none_stated]
  notice: [duration, reasonable, none, not_stated]
  remedy: [refund, right_to_cancel, compensation, none, not_stated]
  source: [human, llm, consensus, gold, claudette, rule, model]
  taxonomy: [T20, T14, T11, T10]
  action_by_theme_T11:      # inventaire fermé d'actions par thème (extensible par version)
    # v0.2 (15 sept. 2026) : + cancel_booking (TERMINATION), + deem_acceptance_by_use (MODIFICATION, item i), + disclaim_user_interactions
    # (LIMITATION), + disclaim_advice (WARRANTY), + limit_claim_period (DISPUTES, item q) et pay_arbitration_fees (DISPUTES, asymétrie R3).
    TERMINATION: [terminate, suspend, delete_account, retain_payment, cancel_booking]
    ACCOUNT_USE: [suspend, terminate, restrict_access, bind_by_use]
    MODIFICATION_OF_TERMS: [modify_terms, modify_service, change_price, notify_change, deem_acceptance_by_use]
    FEES_PAYMENT: [change_price, auto_renew, retain_payment, charge_fee, refund, pay_compensation, compensation]
    LIMITATION_LIABILITY: [exclude_liability, cap_liability, exclude_remedy, indemnify, disclaim_user_interactions]
    WARRANTY_DISCLAIMER: [exclude_warranty, determine_conformity, disclaim_advice]
    DISPUTES_LAW: [impose_arbitration, waive_class_action, choose_forum, choose_law, restrict_evidence, shift_burden_of_proof, waive_jury, limit_claim_period, pay_arbitration_fees]
    CONTENT_IP: [license_content, remove_content, retain_content, assign_ip]
    FRAMEWORK: [bind_by_use, incorporate_by_reference, interpret_terms, assign_contract, notify]
    THIRD_PARTY_SERVICES: [disclaim_third_party, limit_agent_commitments]
    PRIVACY_DATA: [collect_data, share_data, incorporate_by_reference]

layers:
  L1_documentary:
    nodes:
      Document: {required: [id, name], optional: [population, n_sentences, source_corpus, agreement_alpha]}
      Section:  {required: [id, order], optional: [title]}
      Clause:   {required: [id, source, start, end], optional: [n_sentences, themes_signature, taxonomy]}
      Sentence: {required: [id, index, text], optional: [text_detok, n_tokens, doc_position]}
    relationships:
      CONTAINS:  {from: [Document, Section, Clause], to: [Section, Clause, Sentence]}
      NEXT:      {from: [Sentence, Clause], to: [Sentence, Clause]}
      REFERS_TO: {from: [Clause], to: [Section, Clause], props: [surface]}
  L2_thematic:
    nodes:
      Theme:        {required: [code, taxonomy], optional: [label, stratum]}
      Annotation:   {required: [id, annotator, source, primary], optional: [secondaries, model, version, is_segment_start]}
      GoldDecision: {required: [id, agreement_class, auto_level, confidence], optional: [risk_band, tally, decided_primary, decided_secondaries, finalized]}
    relationships:
      HAS_THEME:    {from: [Sentence, Clause], to: [Theme], props: [source, role, confidence, run_id], required_props: [source, role]}
      ANNOTATED_BY: {from: [Sentence], to: [Annotation]}
      DECIDED_BY:   {from: [Sentence], to: [GoldDecision]}
      PROJECTS_TO:  {from: [Theme], to: [Theme], props: [spec_version]}
  L3_normative:
    nodes:
      Norm:       {required: [id, modality, source, status], optional: [action, object, condition, notice, remedy, confidence, validated_by, validated_at]}
      Party:      {required: [role]}
      ActionType: {required: [code], optional: [theme_scope]}
    relationships:
      STATES:           {from: [Clause], to: [Norm]}
      HAS_ACTOR:        {from: [Norm], to: [Party], cardinality: exactly_one}
      HAS_COUNTERPARTY: {from: [Norm], to: [Party]}
      HAS_ACTION:       {from: [Norm], to: [ActionType]}
      EVIDENCED_BY:     {from: [Norm], to: [Sentence], props: [span], cardinality: at_least_one}
      CONDITIONAL_ON:   {from: [Norm], to: [Norm]}
      EXCEPTION_TO:     {from: [Norm], to: [Norm]}
      CONTRADICTS:      {from: [Norm], to: [Norm], props: [run_id]}
    constraints:
      - "a Norm has exactly one modality"
      - "remedy is null/not_stated when modality = prohibition"
      - "action ∈ action_by_theme_T11[theme of the stating clause] (warn, not reject, for cross-theme clauses)"
      - "every evidence sentence belongs to the stating clause"
  L4_legal:
    nodes:
      LegalSource: {required: [id, title, jurisdiction], optional: [bindingness]}
      AnnexItem:   {required: [code, text], optional: [expressibility, risk_class]}
      Category:    {required: [code], optional: [definition]}
      Rule:        {required: [id, version, item, family, rules_hash, frozen_at]}
    relationships:
      PART_OF:      {from: [AnnexItem], to: [LegalSource]}
      MAPS_TO:      {from: [AnnexItem], to: [Category]}
      MATCHES_ITEM: {from: [Norm], to: [AnnexItem], props: [rule_id, rule_version, run_id, evidence_ids, superseded_by], required_props: [rule_id, rule_version, run_id]}
      LABELED:      {from: [Sentence], to: [Category], props: [severity, source], isolation: "never read by Rule compilation"}
  L5_results:
    relationships:
      PREDICTED:  {from: [Sentence, Clause], to: [Category], props: [model, version, run_id, score, split]}
      SIMILAR_TO: {from: [Clause], to: [Clause], props: [method, score, run_id]}
    node_properties:
      Clause: [embedding_node2vec, embedding_text]   # vecteurs, optionnels, datés par run_id
  provenance:
    nodes:
      Run:      {required: [id, kind, started_at], optional: [model, version, prompt_hash, schema_hash, rules_hash, seed, temperature, code_version, cost]}
      Activity: {required: [id, kind, actor, at], optional: [before, after]}   # validations et corrections humaines
    relationships:
      PRODUCED_BY: {from: [Annotation, GoldDecision, Norm, Rule], to: [Run]}
      EDITED_BY:   {from: [Norm], to: [Activity]}

derived_views:   # jamais stockées : requêtes Cypher nommées
  IMPOSES:  "Norm.modality = obligation AND HAS_ACTOR → user"
  GRANTS:   "Norm.modality IN [permission, power] AND HAS_ACTOR → provider"
  PROHIBITS: "Norm.modality = prohibition"
  ALLOWS:   "Norm.modality = permission AND HAS_ACTOR → user"

integrity:
  uniqueness: [Document.id, Section.id, Clause.id, Sentence.id, Norm.id, "Theme(code,taxonomy)", AnnexItem.code, Category.code, "Rule(id,version)", Run.id]
  existence:  [Sentence.text, Norm.modality, Norm.source, Norm.status, Rule.rules_hash]
  isolation:  "Rule compilation rejects any reference to LABELED or Category"
  append_only: [MATCHES_ITEM, PREDICTED, SIMILAR_TO]

rdf_export_mapping:   # vue B (publication FAIR) — indicatif
  Norm: "lkif:Norm / odrl:Rule (Permission|Prohibition|Duty)"
  Party: "lkif:Agent / odrl:Party"
  ActionType: "odrl:Action"
  AnnexItem: "eli:LegalResourceSubdivision"
  Run/Activity: "prov:Activity"
