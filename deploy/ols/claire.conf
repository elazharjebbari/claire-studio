docRoot                   $VH_ROOT
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  logLevel                WARN
  rollingSize             10M
}
accesslog $VH_ROOT/logs/access.log {
  rollingSize             10M
  keepDays                10
}

extprocessor claire_backend {
  type                    proxy
  address                 http://127.0.0.1:8017
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

extprocessor claire_web {
  type                    proxy
  address                 http://127.0.0.1:8018
  maxConns                200
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/claire-studio/html/.well-known/acme-challenge/
  allowBrowse             1
  addDefaultCharset       off
}

context /static/ {
  location                /var/www/claire-studio/backend/staticfiles/
  allowBrowse             1
  addDefaultCharset       off
}

context /api/ {
  type                    proxy
  handler                 claire_backend
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 claire_web
  addDefaultCharset       off
}

websocket /ws/ {
  address                 127.0.0.1:8017
}

rewrite  {
  enable                  1
  logLevel                0
  rules                   <<<END_rules
RewriteCond %{SERVER_PORT} 80
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
  END_rules
}
