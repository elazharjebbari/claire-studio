docRoot                   /var/www/claire-studio/backend
vhDomain                  pactiva.legal
enableGzip                1
errorlog /usr/local/lsws/claire-studio/logs/error.log { logLevel WARN; rollingSize 10M; }
accesslog /usr/local/lsws/claire-studio/logs/access.log { rollingSize 10M; keepDays 10; }

extprocessor claire_backend { type proxy; address 127.0.0.1:8017; maxConns 100; initTimeout 60; retryTimeout 0; respBuffer 0; }
extprocessor claire_web     { type proxy; address 127.0.0.1:8018; maxConns 200; initTimeout 60; retryTimeout 0; respBuffer 0; }

context /.well-known/acme-challenge/ { location /usr/local/lsws/claire-studio/html/.well-known/acme-challenge/; allowBrowse 1; }
context /static/ { location /var/www/claire-studio/backend/staticfiles/; allowBrowse 1; }
context /api/ { type proxy; handler claire_backend; addDefaultCharset off; }
context /ws/  { type proxy; handler claire_backend; addDefaultCharset off; }
context /     { type proxy; handler claire_web;     addDefaultCharset off; }

vhssl {
  keyFile  /etc/letsencrypt/live/pactiva.legal/privkey.pem
  certFile /etc/letsencrypt/live/pactiva.legal/fullchain.pem
  certChain 1
}
