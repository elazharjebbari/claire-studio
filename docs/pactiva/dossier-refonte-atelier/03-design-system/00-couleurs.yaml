# Palette d'usage — atelier d'annotation (tokens sémantiques, zéro hex en dur)
couleurs:
  - usage: "Validé / succès (clause validée, état succès d'un bouton, accord LLM)"
    token: "--sem-success"
    note: "Remplace tous les #34D399 / #34C77B / emerald-400/500/300 et bg-emerald-400. Canaux RGB déjà déclinés clair (52 199 123) / sombre (30 122 77), opacité via <alpha-value>. AA recalculé en clair via readableTextColor."
  - usage: "Alerte / attention (adopté non validé, triage à arbitrer, prefill destructeur, divergence LLM, vue-juge)"
    token: "--sem-warning"
    note: "Remplace amber-300/400/200, #FBBF24, #F59E0B. Déclinaison clair (224 161 0) / sombre (154 103 0). Le prefill passe en warning pour signaler le caractère destructeur AVANT le clic."
  - usage: "Danger / destructif (Désannoter, Supprimer, Effacer, écrasement, erreur de bouton, sévérité haute injustice)"
    token: "--sem-danger"
    note: "Remplace red-400, #F43F5E, #EC4899 (repli injustice), #DC2626/#EF4444. Déclinaison clair (242 88 95) / sombre (180 35 42). Réservé aux actions irréversibles et à l'état erreur."
  - usage: "Info / secondaire (badge +N multi-label, source LLM, niveau d'info neutre)"
    token: "--sem-info"
    note: "Remplace #64B5F6 / #5B9DFF et rgb(100 181 246/0.x). Déclinaison clair (91 157 255) / sombre (12 68 124). Opacité de fond via <alpha-value>, jamais par concaténation hex."
  - usage: "Couleur métier de THÈME (20 thèmes CLAUDETTE) — distincte des tokens d'état"
    token: "--theme-* (par code, injecté via getThemeToken)"
    note: "Frontière formalisée : une couleur de thème ne doit JAMAIS servir de 'succès/alerte'. Glyphe monochrome en currentColor porté par cette couleur ; jamais l'unique vecteur de sens (forme + libellé en doublure)."
  - usage: "Niveaux de triage / certitude C1→C5 (token métier, pas token d'état)"
    token: "--triage-c1..c5 (ex-TRIAGE_LEVEL_META)"
    note: "Remplace les 5 hex bruts #10B981/#84CC16/#8B5CF6/#F59E0B/#F43F5E. Badge avec texte auto-contrasté (readableTextColor) sur fond translucide ; jauge d'accord doublée d'un motif, pas purement chromatique."
  - usage: "Identité de juge LLM (pastilles d'attribution)"
    token: "--judge-* (ex-LLM_JUDGES identityColor)"
    note: "Remplace #94A3B8/#A78BFA/#5EEAD4. Contraste AA garanti pour les pastilles ; couleur doublée par initiale/forme."
  - usage: "Surfaces & structure (panneaux, lignes, bandeaux d'état, rails de repli)"
    token: "--panel / --panel-muted / --line / --ink / --bg"
    note: "Remplace slate-300/400, sky-300/400 dans les bandeaux. Les bandeaux d'état fusionnés s'appuient sur warning/info tokenisés, jamais sur des teintes brutes."
