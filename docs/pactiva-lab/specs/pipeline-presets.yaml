# Presets d'expérience — Pactiva Lab
# Chaque preset est une configuration conforme à `experiment-config.schema.json`.
# Chargé par l'API (`GET /lab/presets`) et proposé dans le mode guidé de l'UI.
#
# PRINCIPE : les presets encodent le protocole en deux étages du plan scientifique
# (§5) — on crible avec ce qui est rapide, on confirme avec ce qui est lourd.
# Ils ne sont PAS une liste de tout ce qui est possible : ce sont les chemins recommandés.

version: 1

# ─────────────────────────────────────────────────────────────────────────────
# Blocs thématiques — le registre ORDONNÉ des groupes du lanceur (mode guidé).
# Chaque preset référence un `theme` ci-dessous ; `papers` ([long|court]) et `stage`
# (reference|criblage|confirmation|ablation) portent la classification décidée dans
# docs/pactiva-lab/05_BLOCS_ET_PROGRAMMES.md — servie telle quelle par l'API.
# ─────────────────────────────────────────────────────────────────────────────
themes:
  - id: planchers
    label: "Planchers de référence"
    description: "Sans plancher, aucun gain n'est interprétable : les modèles volontairement simples qui ancrent toutes les comparaisons."
  - id: references-llm
    label: "Juges LLM"
    description: "La référence zéro-shot figée, évaluée sous le même protocole que les modèles entraînés."
  - id: pretraitement
    label: "Prétraitement & contexte"
    description: "Ce que le texte d'entrée doit contenir : criblage des axes de prétraitement, ablation du contexte."
  - id: representations
    label: "Représentations & encodeurs"
    description: "Embeddings gelés, fine-tuning, encodeurs juridiques contre généralistes, kNN explicable."
  - id: donnees-annotation
    label: "Données & annotation"
    description: "Combien annoter, la qualité du gold, la robustesse au bruit — les questions de campagne."
  - id: taches-avancees
    label: "Tâches avancées (T2/T3)"
    description: "Multi-étiquettes et frontières : la tâche réelle du papier phare, et le point dur."
  - id: mesure-accord
    label: "Mesures d'accord & de gold"
    description: "Les chiffres d'E1–E5 du papier de mesure, recalculés sur export daté : coût du multi-label, matrice annotateurs×juges, frontières reconstruites, cascade gold."
  - id: graphe-anomalies
    label: "Hypergraphe & anomalies"
    description: "La partie graphe du papier long : l'identité des combinaisons de thèmes comme signal d'abusivité, évaluée contre CLAUDETTE — avec ses ablations d'honnêteté."

presets:

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAGE 1 — criblage : rapide, sans GPU, pour éliminer les axes sans effet
  # ─────────────────────────────────────────────────────────────────────────────

  - id: baseline-fast
    theme: planchers
    papers: [long]
    stage: reference
    label: "Baselines rapides (plancher de référence)"
    why: >
      À lancer EN PREMIER sur tout nouveau dataset. Sans plancher, aucun gain n'est
      interprétable. Tourne en quelques minutes sur CPU.
    duration_hint: "~3 min CPU"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, case: lower, max_length: 128 }
      model: { family: tfidf_linear, classifier: logreg, ngram_max: 2, class_weight: balanced }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, human_ceiling: true }
      compute: { target: local }

  - id: position-only
    theme: planchers
    papers: [long]
    stage: reference
    label: "Position seule (diagnostic)"
    why: >
      Baseline DIAGNOSTIQUE : que prédit la seule position de la phrase dans le document ?
      Si elle est forte, la question Q2 (rôle du contexte) est déjà à moitié répondue —
      et cela change la lecture de tous les autres résultats.
    duration_hint: "~1 min CPU"
    config:
      task: T1_primary
      preprocess: { detokenize: none }
      model: { family: position_only }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, human_ceiling: true }
      compute: { target: local }

  - id: llm-judges-baseline
    theme: references-llm
    papers: [long, court]
    stage: reference
    label: "Les 4 juges LLM (baseline figée)"
    why: >
      Ne relance AUCUN modèle : lit les prédictions déjà en base. Comparateur gratuit
      pour la question Q5 (le supervisé bat-il les LLM ?).
    duration_hint: "~30 s"
    config:
      task: T1_primary
      preprocess: { detokenize: none }
      model: { family: llm_judge, judge: fable }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, human_ceiling: true }
      compute: { target: local }
    sweep:
      mode: grid
      axes: { "/model/judge": [fable, claude, codex, mistral] }

  - id: screening-preprocess
    theme: pretraitement
    papers: [long]
    stage: criblage
    label: "Criblage des prétraitements"
    why: >
      Étage 1 du protocole : teste les axes de prétraitement sur un modèle bon marché.
      Les axes sans effet ici sont abandonnés avant de toucher au GPU.
    duration_hint: "~25 min CPU (24 runs)"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, case: lower }
      model: { family: tfidf_linear, classifier: logreg, class_weight: balanced }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, human_ceiling: true }
      compute: { target: local }
    sweep:
      mode: grid
      # 2×2×2×2×3 = 48 combinaisons — le plafond doit les couvrir. Il déclarait 24
      # (incohérence attrapée par le garde-fou de sweep lors du Palier 5 réel du
      # 14 août 2026 : 400 sweep_too_large, zéro run créé) ; corrigé le 15 août.
      max_runs: 48
      axes:
        "/preprocess/detokenize": [none, regex_rules]
        "/preprocess/case": [keep, lower]
        "/preprocess/stopwords": [none, english]
        "/preprocess/normalization": [none, lemma]
        "/preprocess/context/window_before": [0, 1, 2]

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAGE 2 — embeddings gelés : bon rapport qualité/prix, CPU acceptable
  # ─────────────────────────────────────────────────────────────────────────────

  - id: embeddings-frozen
    theme: representations
    papers: [long]
    stage: criblage
    label: "Embeddings gelés + tête légère"
    why: >
      Encode une seule fois (cache), puis compare plusieurs têtes quasi gratuitement.
      Répond à Q4 : le fine-tuning vaut-il son coût ?
    duration_hint: "~15 min CPU / ~4 min GPU"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, max_length: 256 }
      model:
        family: embeddings_head
        encoder: intfloat/e5-large-v2
        pooling: mean
        head: logreg
        cache_embeddings: true
      evaluation:
        split: { scheme: group_kfold_document, k: 5 }
        human_ceiling: true
        error_analysis: true
      compute: { target: local }
    sweep:
      mode: grid
      max_runs: 16
      axes:
        "/model/encoder":
          - sentence-transformers/all-mpnet-base-v2
          - intfloat/e5-large-v2
          - BAAI/bge-large-en-v1.5
          - nlpaueb/legal-bert-base-uncased
        "/model/head": [logreg, linear_svm, knn, mlp]

  - id: knn-explainable
    theme: representations
    papers: []
    stage: reference
    label: "k-NN sur embeddings (explicable par l'exemple)"
    why: >
      Valeur propre en AI & Law : la prédiction s'explique par « les k phrases les plus
      proches, étiquetées ainsi ». Alimente aussi les suggestions de l'atelier.
    duration_hint: "~5 min CPU (embeddings en cache)"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, max_length: 256 }
      model: { family: embeddings_head, encoder: intfloat/e5-large-v2, head: knn, knn_k: 5 }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, error_analysis: true }
      compute: { target: local }

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAGE 3 — fine-tuning : GPU, Grid'5000 recommandé
  # ─────────────────────────────────────────────────────────────────────────────

  - id: legal-bert-finetune
    theme: representations
    papers: [long]
    stage: confirmation
    label: "Legal-BERT — fine-tuning (T1)"
    why: "Le modèle de référence du domaine (LexGLUE/UNFAIR-ToS). Résultat principal attendu."
    duration_hint: "~45 min GPU"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, max_length: 128, context: { window_before: 1, window_after: 1 } }
      model:
        family: transformer_finetune
        checkpoint: nlpaueb/legal-bert-base-uncased
        epochs: 8
        batch_size: 16
        learning_rate: 2.0e-5
        loss: weighted_ce
        early_stopping_patience: 3
      evaluation:
        split: { scheme: group_kfold_document, k: 5, inner_k: 3 }
        bootstrap: { enabled: true, n_resamples: 1000 }
        human_ceiling: true
        calibration: true
        error_analysis: true
        cross_reference_unfair: true
      compute: { target: g5k, require_gpu: true, g5k: { site: nancy, resources: "gpu=1,walltime=03:00" } }

  - id: multilabel-finetune
    theme: taches-avancees
    papers: [long, court]
    stage: confirmation
    label: "Multi-label (T2) — l'ensemble des thèmes"
    why: >
      La tâche RÉELLE du protocole d'annotation. À comparer au plafond α-MASI (0,635),
      pas au plafond κ de T1.
    duration_hint: "~45 min GPU"
    config:
      task: T2_multilabel
      preprocess: { detokenize: regex_rules, max_length: 128, context: { window_before: 1, window_after: 1 } }
      model:
        family: transformer_finetune
        checkpoint: nlpaueb/legal-bert-base-uncased
        epochs: 10
        loss: bce
      evaluation:
        split: { scheme: group_kfold_document, k: 5, inner_k: 3 }
        bootstrap: { enabled: true }
        human_ceiling: true
        error_analysis: true
      compute: { target: g5k, require_gpu: true, g5k: { site: nancy, resources: "gpu=1,walltime=03:00" } }

  - id: encoders-comparison
    theme: representations
    papers: [long]
    stage: confirmation
    label: "Comparaison d'encodeurs (fine-tuning)"
    why: "Legal-BERT vs généralistes : le domaine juridique paie-t-il ?"
    duration_hint: "~3 h GPU (4 runs)"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, max_length: 128 }
      model: { family: transformer_finetune, checkpoint: nlpaueb/legal-bert-base-uncased, epochs: 8 }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, bootstrap: { enabled: true }, human_ceiling: true }
      compute: { target: g5k, require_gpu: true, g5k: { site: nancy, resources: "gpu=1,walltime=06:00" } }
    sweep:
      mode: grid
      max_runs: 4
      axes:
        "/model/checkpoint":
          - nlpaueb/legal-bert-base-uncased
          - roberta-base
          - microsoft/deberta-v3-base
          - answerdotai/ModernBERT-base

  - id: sequence-boundary
    theme: taches-avancees
    papers: [long, court]
    stage: confirmation
    label: "Segmentation (T3) — étiquetage de séquence"
    why: >
      Le point dur : l'accord humain sur les frontières n'est que de 0,39–0,63 en Jaccard.
      Traite T1 et T3 conjointement (les thèmes viennent par blocs).
    duration_hint: "~1 h GPU"
    config:
      task: T3_boundary
      preprocess: { detokenize: regex_rules, max_length: 128 }
      model: { family: sequence_labeling, encoder: nlpaueb/legal-bert-base-uncased, crf: true, doc_chunk_size: 64 }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, bootstrap: { enabled: true }, human_ceiling: true }
      compute: { target: g5k, require_gpu: true }

  # ─────────────────────────────────────────────────────────────────────────────
  # ABLATIONS ET COURBES — les résultats d'article
  # ─────────────────────────────────────────────────────────────────────────────

  - id: ablation-context
    theme: pretraitement
    papers: [long]
    stage: ablation
    label: "Ablation — effet du contexte (Q2)"
    why: "Contribution originale : le thème d'une phrase juridique est-il surtout positionnel ?"
    duration_hint: "~2 h GPU (6 runs)"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules, max_length: 256 }
      model: { family: transformer_finetune, checkpoint: nlpaueb/legal-bert-base-uncased, epochs: 8 }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, bootstrap: { enabled: true }, human_ceiling: true }
      compute: { target: g5k, require_gpu: true, g5k: { resources: "gpu=1,walltime=04:00" } }
    sweep:
      mode: ablation
      max_runs: 6
      axes:
        "/preprocess/context/window_before": [0, 1, 2]
        "/preprocess/context/include_doc_position": [false, true]

  - id: learning-curve
    theme: donnees-annotation
    papers: [long]
    stage: criblage
    label: "Courbe d'apprentissage — combien de documents faut-il ?"
    why: >
      LE résultat le plus actionnable du plan : répond empiriquement à « quand peut-on
      arrêter d'annoter ? ». Aucune donnée nouvelle requise.
    duration_hint: "~30 min CPU (embeddings) / ~3 h GPU (fine-tuning)"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules }
      model: { family: embeddings_head, encoder: intfloat/e5-large-v2, head: logreg, cache_embeddings: true }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, bootstrap: { enabled: true }, human_ceiling: true }
      compute: { target: local }
    sweep:
      mode: learning_curve
      learning_curve_sizes: [5, 10, 20, 30, 40]
      repeats: 5
      max_runs: 25

  - id: ablation-gold-quality
    theme: donnees-annotation
    papers: [court]
    stage: ablation
    label: "Ablation — la qualité du gold paie-t-elle ? (A5)"
    why: >
      Entraîner sur `submitted` vs `complete` vs `gold` finalisé. Répond à « l'arbitrage
      vaut-il son coût ? » — décision stratégique pour la suite de la campagne.
    duration_hint: "~20 min CPU"
    note: "Nécessite trois datasets construits avec des maturités différentes."
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules }
      model: { family: embeddings_head, encoder: intfloat/e5-large-v2, head: logreg }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, human_ceiling: true }
      compute: { target: local }

  - id: ablation-label-noise
    theme: donnees-annotation
    papers: [long]
    stage: ablation
    label: "Ablation — robustesse au bruit d'étiquetage (A6)"
    why: "Borne de fiabilité : jusqu'où le modèle tient-il quand le gold se dégrade ?"
    duration_hint: "~20 min CPU"
    config:
      task: T1_primary
      preprocess: { detokenize: regex_rules }
      model: { family: embeddings_head, encoder: intfloat/e5-large-v2, head: logreg }
      evaluation: { split: { scheme: group_kfold_document, k: 5 }, bootstrap: { enabled: true } }
      compute: { target: local }
    sweep:
      mode: ablation
      repeats: 3
      axes: { "/evaluation/label_noise": [0.0, 0.05, 0.10, 0.20] }

  # ─────────────────────────────────────────────────────────────────────────────
  # MESURES ET GRAPHE — les expériences des papiers (docs/pactiva-experiences-papiers)
  # ─────────────────────────────────────────────────────────────────────────────

  - id: iaa-mesure
    theme: mesure-accord
    papers: [long, court]
    stage: reference
    label: "Mesures d'accord (E1–E4)"
    why: >
      Le socle chiffré du papier de mesure, recalculé sur export daté (jamais une
      requête ad hoc) : coût du multi-label (α-MASI vs α nominal, IC bootstrap par
      document, différence appariée), matrice annotateurs × juges, accord de frontières
      RECONSTRUITES (jamais le κ d'ancres artefactuel), divergence aux juges.
      Nécessite un dataset construit après le 16 août (votes.jsonl).
    duration_hint: "~2 min CPU"
    config:
      task: M1_agreement
      preprocess: { detokenize: none }
      model: { family: measurement }
      evaluation: { bootstrap: { enabled: true, n_resamples: 1000 } }
      compute: { target: local }

  - id: gold-cascade
    theme: mesure-accord
    papers: [court]
    stage: reference
    label: "Cascade gold (E5) — le coût de l'arbitrage"
    why: >
      Parts auto_1click / auto / manual, ce que l'arbitrage humain change par rapport à
      la pluralité des votes, ambiguïté résiduelle. L'état non finalisé s'affiche tel
      quel — les chiffres définitifs exigent des résolutions finalisées (plan V2).
    duration_hint: "~30 s CPU"
    config:
      task: M2_gold_cascade
      preprocess: { detokenize: none }
      model: { family: measurement }
      evaluation: { bootstrap: { enabled: false } }
      compute: { target: local }

  - id: cooccurrence-abusivite
    theme: graphe-anomalies
    papers: [long]
    stage: confirmation
    label: "Co-occurrence de thèmes → abusivité (G2)"
    why: >
      LE tableau de la partie graphe : scores d'anomalie NON supervisés (rareté de
      combinaison, NPMI min, LOF, IsolationForest, OCSVM) évalués contre les labels
      CLAUDETTE (AUC-PR, precision@k, lift), avec contrôle négatif (cardinalité) et
      référence supervisée assumée (identité de combinaison). CV par document sur les
      plis figés. Produit l'artefact hypergraphe.
    duration_hint: "~3 min CPU"
    config:
      task: G2_cooccurrence
      preprocess: { detokenize: none }
      model: { family: cooccurrence_anomaly, unit: segment, deontic: none }
      evaluation: { bootstrap: { enabled: true, n_resamples: 1000 } }
      compute: { target: local }

  - id: cooccurrence-deontique
    theme: graphe-anomalies
    papers: [long]
    stage: ablation
    label: "Ablation D1 — la couche déontique prédite paie-t-elle ?"
    why: >
      Transforme la limite « pas de nature déontique donnée » en résultat : une couche
      déontique PRÉDITE (proxy à règles de modaux, déclaré) est ajoutée à l'identité de
      combinaison — l'effet (positif OU négatif) est mesuré. Un résultat négatif est
      publiable : c'est la contribution méthodologique de D1.
    duration_hint: "~6 min CPU (2 runs)"
    config:
      task: G2_cooccurrence
      preprocess: { detokenize: none }
      model: { family: cooccurrence_anomaly, unit: segment, deontic: none }
      evaluation: { bootstrap: { enabled: true, n_resamples: 1000 } }
      compute: { target: local }
    sweep:
      mode: ablation
      max_runs: 2
      axes:
        "/model/deontic": [none, rule_based]

  - id: cooccurrence-bruit
    theme: graphe-anomalies
    papers: [long]
    stage: ablation
    label: "Ablation G5 — stabilité des anomalies sous bruit de thèmes"
    why: >
      Jusqu'où la détection tient-elle quand les thèmes amont se dégradent (simulation
      macro-F1 0,83 → ~0,60 par corruption de 10–35 % des affectations d'entraînement) ?
      La borne de fiabilité opérationnelle du pipeline — le pendant détection de
      l'ablation-label-noise du classifieur.
    duration_hint: "~12 min CPU (4 runs)"
    config:
      task: G2_cooccurrence
      preprocess: { detokenize: none }
      model: { family: cooccurrence_anomaly, unit: segment, deontic: none }
      evaluation: { bootstrap: { enabled: true, n_resamples: 1000 } }
      compute: { target: local }
    sweep:
      mode: ablation
      max_runs: 4
      axes:
        "/evaluation/label_noise": [0.0, 0.10, 0.20, 0.35]

# ─────────────────────────────────────────────────────────────────────────────
# Ordre d'exécution recommandé
# ─────────────────────────────────────────────────────────────────────────────
recommended_order:
  - baseline-fast          # sans plancher, rien n'est interprétable
  - position-only          # diagnostic : que dit la structure seule ?
  - llm-judges-baseline    # gratuit, déjà en base
  - iaa-mesure             # le socle chiffré des deux papiers (E1–E4)
  - screening-preprocess   # élimine les axes sans effet AVANT le GPU
  - embeddings-frozen      # le bon rapport qualité/prix
  - learning-curve         # le résultat le plus actionnable
  - legal-bert-finetune    # le résultat principal
  - ablation-context       # la contribution originale
  - multilabel-finetune    # la tâche réelle
  - sequence-boundary      # le point dur
  - cooccurrence-abusivite # la partie graphe du papier long (G2)
