# =============================================================================
# CLAIRE Studio — orchestration des services (dev / pile complète)
# Services : postgres + backend (Django/DRF :8000) + frontend (Next.js :3001)
#            + adminer (optionnel, profil `tools`).
# Les Dockerfiles vivent dans backend/ et frontend/ (produits par d'autres agents).
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: claire-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: claire-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claire}
      POSTGRES_USER: ${POSTGRES_USER:-claire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claire}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claire} -d ${POSTGRES_DB:-claire}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: claire-backend
    env_file:
      - .env
    environment:
      # Surcharge l'hôte DB pour le réseau docker
      DATABASE_URL: ${DATABASE_URL:-postgresql://claire:claire@postgres:5432/claire}
      POSTGRES_HOST: postgres
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_data:/data        # exports / imports / translations confinés
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/v1/'); \" || curl -fsS http://localhost:8000/api/v1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  asgi:
    # Temps réel : Django Channels via Daphne (WebSocket) — point 4b/7.
    # Démarré uniquement avec le profil `realtime` : `docker compose --profile realtime up`.
    build:
      context: ./backend
    container_name: claire-asgi
    profiles: ["realtime"]
    command: ["python", "-m", "daphne", "-b", "0.0.0.0", "-p", "8001", "config.asgi:application"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://claire:claire@postgres:5432/claire}
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${ASGI_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: claire-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8001/ws}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: claire-adminer
    profiles: ["tools"]            # `docker compose --profile tools up adminer`
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  pgdata:
  backend_data:
