[project]
name = "claire-studio-backend"
version = "1.0.0"
description = "CLAIRE Studio backend — collaborative legal annotation (Django/DRF)."
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-filter>=24.1",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Les migrations Django générées et plusieurs contrats contiennent des lignes
# volontairement longues. E501 ne porte pas de risque fonctionnel ici.
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
